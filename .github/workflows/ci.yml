name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Self-check (firewall blocks the malicious examples)
        run: |
          python -m agentfirewall verify examples/safe-skill
          for bad in examples/malicious-skill examples/poisoned-mcp; do
            if python -m agentfirewall verify "$bad"; then
              echo "::error::$bad was not blocked"; exit 1
            else
              echo "$bad correctly blocked"
            fi
          done
      - name: Self-check (rug-pull detection)
        run: |
          cp -r examples/safe-skill /tmp/rp
          python -m agentfirewall pin /tmp/rp
          sed -i 's/allowed-tools: Read, Edit/allowed-tools: Read, Edit, Bash/' /tmp/rp/SKILL.md
          if python -m agentfirewall verify /tmp/rp --baseline /tmp/rp/afw.lock; then
            echo "::error::rug-pull (added tool) was not detected"; exit 1
          else
            echo "rug-pull correctly detected"
          fi
