name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Self-check (firewall blocks the malicious example)
        run: |
          python -m agentfirewall verify examples/safe-skill
          if python -m agentfirewall verify examples/malicious-skill; then
            echo "::error::malicious example was not blocked"; exit 1
          else
            echo "malicious example correctly blocked"
          fi
