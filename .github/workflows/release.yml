name: Release

# Publishes to PyPI and creates a GitHub Release when a version tag is pushed.
#
# PyPI publishing uses Trusted Publishing (OIDC) — no API token is stored. Before
# the first release, configure a Trusted Publisher on PyPI for this project:
#   PyPI → your project → Publishing → add a GitHub Actions publisher with
#   owner=mmedabo, repo=agentfirewall, workflow=release.yml, environment=pypi.
#
# Cut a release by tagging main after a version bump:
#   git tag v0.6.0 && git push origin v0.6.0

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
