<!-- The site used to live in this folder and now lives at the repository root.
     The ?r=1 is deliberate: a browser holding the old cached root->docs redirect
     would otherwise bounce between the two. A distinct URL is a distinct cache
     key, so this always reaches the real page. -->

<script>location.replace("../?r=1" + location.hash);</script>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a0c;color:#9aa0b4;
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;line-height:1.6}
  a{color:#00f3ff}
</style>
</head>
<body>

     If nothing happens, <a href="../?r=1">open the site</a>.</p>
