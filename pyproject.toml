[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfirewall"
version = "0.3.0"
description = "A security firewall for AI agents, skills and MCP servers — scan before you install."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AgentFirewall contributors" }]
keywords = ["security", "ai-agents", "llm", "mcp", "skills", "firewall", "supply-chain", "prompt-injection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=5.1"]
dev = ["pytest>=7", "PyYAML>=5.1"]

[project.urls]
Homepage = "https://github.com/mmedabo/agentfirewall"
Repository = "https://github.com/mmedabo/agentfirewall"
Issues = "https://github.com/mmedabo/agentfirewall/issues"

[project.scripts]
afw = "agentfirewall.cli:main"
agentfirewall = "agentfirewall.cli:main"

[tool.setuptools.packages.find]
include = ["agentfirewall*"]

[tool.setuptools.package-data]
agentfirewall = ["data/intel/*.json", "data/intel/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
